name: supervisor_composition
description: >-
  Observe-only supervisor composition declaring dart_flutter_packages'
  local model serving on the shipped oka substrate (ADR-0040 R1, ADR-0041
  L0). Never spawns, never signals.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  oka_core: {path: /Users/antonio/xs/oka/packages/oka_core}
  oka_supervisor: {path: /Users/antonio/xs/oka/packages/oka_supervisor}
  resource_composition:
    {path: /Users/antonio/xs/oka/packages/resource_composition}

# The oka packages declare resource_composition as a hosted constraint;
# this composition roots the whole substrate at the oka checkout, so the
# path source must win over the hosted source.
dependency_overrides:
  resource_composition:
    path: /Users/antonio/xs/oka/packages/resource_composition

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  xsoulspace_lints: {path: ../../pkgs/xsoulspace_lints}
