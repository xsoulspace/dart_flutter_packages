name: supervisor_composition
description: >-
  Observe-only supervisor composition declaring dart_flutter_packages'
  local model serving on the shipped oka substrate (ADR-0040 R1, ADR-0041
  L0). Never spawns, never signals.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  oka_core: ^0.8.1
  oka_supervisor: ^0.8.1
  resource_composition: ^0.8.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0
  xsoulspace_lints: {path: ../../pkgs/xsoulspace_lints}
