name: universal_automation_toolkit
description: >-
  Agent-facing surface for the universal automation family: declarative
  plans with a fail-closed runner, an observe/act/verify CLI, and an MCP
  stdio server. One binary, two faces. No Flutter, no process lifecycle.
version: 0.1.0
homepage: https://github.com/xsoulspace/dart_flutter_packages
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues
documentation: https://github.com/xsoulspace/dart_flutter_packages/tree/main/pkgs/universal_automation_toolkit

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  args: ^2.7.0
  universal_automation_interface: ^0.2.0
  universal_browser_cdp: ^0.3.0
  yaml: ^3.1.3

dev_dependencies:
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2

executables:
  universal-automation: universal_automation_toolkit

topics:
  - automation
  - browser
  - cli
  - mcp
