name: xsoulspace_inference_apple_foundation
description: Apple Foundation Models (SystemLanguageModel) backend for
  xsoulspace_inference_core via a pure-Dart FFI bridge (macOS 26+).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  code_assets: any
  ecsly_serialization: ^0.1.0-dev.1
  ffi: ^2.2.0
  hooks: any
  path: ^1.9.1
  # FFI transport only (ADR 0036). The harnessd composition root lives in
  # ~/xs/ecsai_harness/pkgs/xsoulspace_agentic_afm.
  xsoulspace_inference_core:
    path: ../xsoulspace_inference_core


dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2
