name: xsoulspace_inference_apple_foundation
description: Apple Foundation Models (SystemLanguageModel) backend for
  xsoulspace_inference_core via a pure-Dart FFI bridge (macOS 26+).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  code_assets: any
  dart_acp_toolkit:
    path: /Users/antonio/mcp/cline/intentcall/packages/acp_toolkit
  ecsly_serialization: ^0.1.0-dev.1
  ffi: ^2.2.0
  hooks: any
  path: ^1.9.1
  # ADR 0025: provider-thin — this package owns only the FFI transport and
  # the thin `harnessd` composition root (bin/harnessd.dart); the daemon,
  # coding runner and ACP host policy live in the host package.
  xsoulspace_agentic_host:
    path: ../xsoulspace_agentic_host
  xsoulspace_agentic_harness:
    path: ../xsoulspace_agentic_harness
  # B3 escalation rung (J8.1 tier 3): the daemon's open_router binding.
  xsoulspace_inference_openrouter:
    path: ../xsoulspace_inference_openrouter
  xsoulspace_inference_core:
    path: ../xsoulspace_inference_core


dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2
