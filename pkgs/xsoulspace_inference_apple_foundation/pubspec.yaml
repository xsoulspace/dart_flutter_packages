name: xsoulspace_inference_apple_foundation
description: Apple Foundation Models (SystemLanguageModel) implementation of xsoulspace_inference_core for macOS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  code_assets: any
  ecsly_serialization:
    path: /Users/antonio/xs/ecsly/plugins/ecsly_serialization
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  hooks: any
  path: ^1.9.1
  xsoulspace_agentic_harness:
    path: ../xsoulspace_agentic_harness
  xsoulspace_inference_core:
    path: ../xsoulspace_inference_core
  from_json_to_json: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.31.2
  xsoulspace_lints: ^0.1.2

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: XsoulspaceInferenceAppleFoundationPlugin
