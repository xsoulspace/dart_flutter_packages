name: xsoulspace_inference_laya
description: Local Laya decision-model runtime composition (laya-serve) for
  xsoulspace_inference_core.
version: 0.1.0
publish_to: none
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  http: ^1.6.0
  # The local laya-serve runtime speaks the System One wire (the same
  # endpoint family as the hosted OpenRouter System One models), so the
  # loopback adapter is composed from the shared wire implementation instead
  # of duplicating it. See docs/laya_local_provider_PLAN.md.
  xsoulspace_inference_core:
    path: ../xsoulspace_inference_core
  xsoulspace_inference_openrouter:
    path: ../xsoulspace_inference_openrouter

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
