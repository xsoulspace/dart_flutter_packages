name: xsoulspace_inference_laya
description: Local Laya decision-model product composition (laya-serve,
  decision provider + serve runtime) for xsoulspace_inference_core; the
  native engine host lives in xsoulspace_inference_mlx_native (ADR 0057).
version: 0.3.0
publish_to: none
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  # R2 shim dep (ADR 0057): the barrel re-exports the engine host so harness
  # consumers keep compiling unchanged; R3 drops this (consumers import the
  # engine package directly).
  xsoulspace_inference_mlx_native:
    path: ../xsoulspace_inference_mlx_native
  http: ^1.6.0
  # The serve skeleton (process lifecycle, health-gated loopback runtime,
  # wire-server plumbing) is the shared local-serve core; laya composes it
  # instead of owning a private copy.
  xsoulspace_inference_local_serve:
    path: ../xsoulspace_inference_local_serve
  # The local laya-serve runtime speaks the System One wire (the same
  # endpoint family as the hosted OpenRouter System One models), so the
  # loopback adapter is composed from the shared wire implementation instead
  # of duplicating it. See docs/laya_local_provider_PLAN.md.
  xsoulspace_inference_core:
    path: ../xsoulspace_inference_core
  xsoulspace_inference_openrouter:
    path: ../xsoulspace_inference_openrouter

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  # The async-engine wire test drives the shared-executor seam directly.
  async_parallel:
    path: /Users/antonio/xs/ecsly/plugins/async_parallel
