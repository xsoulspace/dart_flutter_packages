id: refactor_patch_01
category: multi_file_refactor
prompt: |
  In lib/pricing.dart, the total() method must include a flat processing fee:
  replace the line `return sum * (1 + tax);` with
  `return (sum + processingFee) * (1 + tax);`.
  Do not change anything else in the file.
fixtures:
  - path: lib/pricing.dart
    content: |
      class Pricing {
        double total(List<double> items, {double tax = 0.19}) {
          var sum = 0.0;
          for (final i in items) {
            sum += i;
          }
          return sum * (1 + tax);
        }

        double discounted(double value, double pct) => value * (1 - pct);
      }
checkers:
  - type: contains
    path: lib/pricing.dart
    value: 'return (sum + processingFee) * (1 + tax);'
  - type: not_contains
    path: lib/pricing.dart
    value: 'return sum * (1 + tax);'
  - type: contains
    path: lib/pricing.dart
    value: 'double discounted(double value, double pct)'
