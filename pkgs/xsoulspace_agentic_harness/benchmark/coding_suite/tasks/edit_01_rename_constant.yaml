id: edit_01_rename_constant
category: file_edit
prompt: |
  In config.dart, rename the constant MAX_USERS to maxUserLimit and update
  every use in that file. Keep the value 10.
fixtures:
  - path: config.dart
    content: |
      const MAX_USERS = 10;

      int capacity() => MAX_USERS * 2;
checkers:
  - type: not_contains
    path: config.dart
    value: MAX_USERS
  - type: contains
    path: config.dart
    values:
      - maxUserLimit
      - "= 10"
