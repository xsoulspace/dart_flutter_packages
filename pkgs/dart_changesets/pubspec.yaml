name: dart_changesets
description: >-
  Changesets-style release engine for Dart monorepos: intent files,
  graph-aware version PRs, and pub.dev publish trains. Designed to be
  extracted into a standalone repository.
version: 0.1.0
homepage: https://github.com/xsoulspace/dart_flutter_packages/tree/main/pkgs/dart_changesets
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues

environment:
  sdk: ^3.14.0
# Workspace member marker — remove this line when extracting to a standalone
# repository.
resolution: workspace

dependencies:
  args: ^2.7.0
  path: ^1.9.0
  pub_semver: ^2.2.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0
