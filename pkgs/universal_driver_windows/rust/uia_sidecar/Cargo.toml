[package]
name = "xs-uia-sidecar"
version = "0.1.0"
edition = "2021"
description = "Windows UI Automation sidecar speaking uia-sidecar/1 JSON-lines over stdio"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
