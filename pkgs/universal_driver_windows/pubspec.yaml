name: universal_driver_windows
description: >-
  Windows accessibility driver for the universal automation family: a
  UI Automation (UIA) driver over a Rust sidecar, mapping the Windows
  control tree onto the family's semantic snapshot model.
version: 0.1.0
homepage: https://github.com/xsoulspace/dart_flutter_packages
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues
documentation: https://github.com/xsoulspace/dart_flutter_packages/tree/main/pkgs/universal_driver_windows
topics:
  - automation
  - windows
  - accessibility
  - uia

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_automation_interface: ^0.1.0

dev_dependencies:
  test: ^1.31.2
  universal_automation_conformance: ^0.1.0
  xsoulspace_lints: ^0.1.2
