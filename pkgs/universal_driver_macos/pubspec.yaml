name: universal_driver_macos
description: >-
  macOS accessibility driver for the universal automation family:
  semantic snapshot and element-at-position over AXUIElement, input
  synthesis over CGEvent. Pure Dart through native-assets build hooks
  (swiftc-compiled code asset, @Native bindings). No Flutter, no plugin
  surface.
version: 0.2.0
homepage: https://github.com/xsoulspace/dart_flutter_packages
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues
documentation: https://github.com/xsoulspace/dart_flutter_packages/tree/main/pkgs/universal_driver_macos

environment:
  sdk: ^3.12.0

resolution: workspace

topics:
  - macos
  - accessibility
  - automation

dependencies:
  code_assets: any
  ffi: ^2.2.0
  hooks: any
  universal_automation_interface: ^0.2.0

dev_dependencies:
  test: ^1.31.2
  universal_automation_conformance: ^0.2.0
  xsoulspace_lints: ^0.1.2
