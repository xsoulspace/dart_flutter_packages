name: universal_storage_world
description: >-
  App- and game-agnostic world model over the convergence kernel (ADR 0047):
  stable member addressing (WorldUrn), interest policies for zone journeys,
  zone catalogs, the member-codec seam, journey phases, and the host-driven
  pulse contract. Pure Dart: no Flutter, no ecsly, no harness, no transports.
version: 0.1.0-dev.1
homepage: https://github.com/xsoulspace/universal_storage_sync
repository: https://github.com/xsoulspace/universal_storage_sync
issue_tracker: https://github.com/xsoulspace/universal_storage_sync/issues

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_storage_convergence: ^0.1.0-dev.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.2
  xsoulspace_lints: ^0.1.2
