name: universal_storage_live_apply
description: >
  Live-apply transaction layer for universal_storage providers: footprint
  journals, verified inverse replay, and rollback windows. Git-free by
  design — structural changes apply in place and stay undoable until commit.
version: 0.1.0-dev.1
homepage: https://github.com/xsoulspace/universal_storage_sync
repository: https://github.com/xsoulspace/universal_storage_sync
issue_tracker: https://github.com/xsoulspace/universal_storage_sync/issues
documentation: https://github.com/xsoulspace/universal_storage_sync/tree/main/pkgs/universal_storage_live_apply

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  path: ^1.9.1
  universal_io: ^2.3.1
  universal_storage_interface: ^0.1.0-dev.12

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.2
  universal_storage_filesystem: ^0.1.0-dev.12
  xsoulspace_lints: ^0.1.2
