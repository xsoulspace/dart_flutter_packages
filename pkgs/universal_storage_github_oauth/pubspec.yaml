name: universal_storage_github_oauth
description: >-
  GitHub OAuth authentication for Universal Storage. Device-flow-first
  (works uniformly on Android, iOS, macOS, Linux, Windows), with a
  configurable token endpoint for web proxy setups and a ready-made
  device-code UI delegate.
version: 0.1.0-dev.1
homepage: https://github.com/xsoulspace/universal_storage_sync
repository: https://github.com/xsoulspace/universal_storage_sync
issue_tracker: https://github.com/xsoulspace/universal_storage_sync/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  from_json_to_json: ^0.5.0
  github: ^9.25.1
  http: ^1.6.0
  universal_storage_oauth:
    path: ../universal_storage_oauth
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  xsoulspace_lints: ^0.1.2
