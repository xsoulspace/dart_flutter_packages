[package]
name = "xs-webrtc-sidecar"
version = "0.1.0"
edition = "2021"
description = "WebRTC engine sidecar speaking JSON-lines over stdio (xs-webrtc-sidecar/1)"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
webrtc = "0.14"

[profile.release]
strip = true
lto = "thin"
