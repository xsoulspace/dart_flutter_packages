name: universal_storage_realtime
description: >-
  Realtime event plane over mesh sessions (ADR 0050): one envelope codec,
  a per-session link with heartbeats, droppable-coalesced sends and
  reliable dedupe, and a multi-sender host with a pluggable arbitration
  policy — the out-of-box half of any app's realtime needs (vosges's
  gesture stream is the reference consumer shape).
version: 0.1.0-dev.1
homepage: https://github.com/xsoulspace/universal_storage_sync
repository: https://github.com/xsoulspace/universal_storage_sync
issue_tracker: https://github.com/xsoulspace/universal_storage_sync/issues

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  meta: ^1.19.0
  universal_storage_mesh_transport: ^0.1.0-dev.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.2
