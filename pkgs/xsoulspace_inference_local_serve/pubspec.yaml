name: xsoulspace_inference_local_serve
description: >-
  Shared composition core for local model servers: health-gated loopback
  serve runtimes (attach-only or spawnOnMiss), managed process lifecycle,
  one-shot health probes, and a pure-Dart loopback wire-server skeleton for
  tests and fakes. Laya (decision) and MLX (text) compose this core instead
  of growing second one-offs.
version: 0.1.0
publish_to: none
repository: https://github.com/xsoulspace/dart_flutter_packages
issue_tracker: https://github.com/xsoulspace/dart_flutter_packages/issues

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
