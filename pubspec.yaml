name: _
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - pkgs/*
  - pkgs/xsoulspace_steamworks/example/

# Version pins and transitive git alignment (no path sources — see
# pubspec_overrides.yaml.example for Anton's local sibling checkouts).
dependency_overrides:
  device_info_plus: 13.1.0
  meta: 1.19.0
  test_api: 0.7.13
  analyzer: 14.1.0
  intl: 0.20.3
  # Git ecsly plugins declare hosted ecsly; pin monorepo SHA for one graph.
  ecsly:
    git:
      url: https://github.com/Arenukvern/ecsly.git
      ref: 3661282c5861c873e0750094b3ef7710228fa5e6
      path: core_packages/ecsly
  ecsly_serialization:
    git:
      url: https://github.com/Arenukvern/ecsly.git
      ref: 3661282c5861c873e0750094b3ef7710228fa5e6
      path: plugins/ecsly_serialization
  async_parallel:
    git:
      url: https://github.com/Arenukvern/ecsly.git
      ref: 3661282c5861c873e0750094b3ef7710228fa5e6
      path: plugins/async_parallel
  ecsly_async_parallel:
    git:
      url: https://github.com/Arenukvern/ecsly.git
      ref: 3661282c5861c873e0750094b3ef7710228fa5e6
      path: plugins/ecsly_async_parallel
  # universal_storage_* git monorepo (live_apply declares hosted siblings).
  universal_storage_interface:
    git:
      url: https://github.com/Arenukvern/universal_storage.git
      ref: bf41893ee5ecc644daf492f2ddd18ed13f08fffd
      path: pkgs/universal_storage_interface
  universal_storage_filesystem:
    git:
      url: https://github.com/Arenukvern/universal_storage.git
      ref: bf41893ee5ecc644daf492f2ddd18ed13f08fffd
      path: pkgs/universal_storage_filesystem
  # xsoulspace_meaning_core declares hosted agentic_executables_wire (unpublished).
  agentic_executables_wire:
    git:
      url: https://github.com/fluent-meaning-symbiotic/agentic_executables.git
      ref: e4387315447cb6a64123271af7cdada66fc1b7d7
      path: agentic_executables_wire
