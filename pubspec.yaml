name: _
publish_to: none
environment:
  sdk: ^3.12.0
workspace:
  - pkgs/*
  - pkgs/xsoulspace_steamworks/example/
  - pkgs/xsoulspace_inference_gemma_flutter/example/
  - pkgs/universal_storage_sync/example/todo_file_app/
  - pkgs/universal_storage_mesh/example/mesh_pairing_app/
  - pkgs/universal_storage_sync/example/todo_git_app/

dependency_overrides:
  mcp_toolkit: 5.0.4
  device_info_plus: 13.1.0
  meta: 1.19.0
  test_api: 0.7.13
  analyzer: 14.1.0
  intl: 0.20.3
  dart_acp_toolkit:
    path: /Users/antonio/mcp/cline/intentcall/packages/acp_toolkit
  # dart_acp_toolkit needs the intentcall 0.7.0 family while hosted
  # mcp_toolkit 5.0.4 pins ^0.6.0 — the checkouts satisfy both (path
  # overrides bypass version solving), same pin as the vosges workspace.
  intentcall_schema:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_schema
  intentcall_core:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_core
  intentcall_bridge:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_bridge
  intentcall_platform:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_platform
  intentcall_platform_sync:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_platform_sync
  intentcall_platform_apple:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_platform_apple
  intentcall_platform_android:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_platform_android
  intentcall_session:
    path: /Users/antonio/mcp/cline/intentcall/packages/intentcall_session
  agentic_executables_wire:
    path: ../../agentic_executables/agentic_executables_wire
  ecsly:
    path: ../../ecsly/core_packages/ecsly
  ecsly_serialization:
    path: ../../ecsly/plugins/ecsly_serialization
  ecsly_flutter:
    path: ../../ecsly/core_packages/ecsly_flutter
  ecsly_codegen:
    path: /Users/antonio/xs/ecsly/core_packages/ecsly_codegen
  ecsly_app:
    path: ../../ecsly/core_packages/ecsly_app
  ecsly_async_parallel:
    path: /Users/antonio/xs/ecsly/plugins/ecsly_async_parallel
  async_parallel:
    path: ../../ecsly/plugins/async_parallel
