name: mlx_native lane gate

# The lane's CI-able subset — re-scoped 2026-10-27 from the FIRST real run
# (40486026348), whose evidence named two clean-clone blockers:
#
#   * The DART leg cannot run on a clean clone AT ALL: the workspace root
#     pubspec.yaml's dependency_overrides map whole package families (ecsly,
#     intentcall, universal_automation, universal_storage, …) to machine-
#     private checkouts, some at absolute /Users/antonio/... paths, and
#     `resolution: workspace` makes every package's pub get resolve the
#     root. Fixing that is an OWNER decision (publish the families or
#     vendor them) — not this lane's call. Until then `flutter test` is
#     local-only; on this machine it is green (42 pass / 1 skip).
#   * The NATIVE leg's `cargo test` needs the cmake-built MLX/mlxc static
#     libraries (build/mlx-install, build/mlxc-install), which are
#     machine-local by design; build.rs refuses loudly without them. The
#     REAL test gate stays local (on AC, ADR 0061). What a clean runner
#     CAN prove is that all Rust code and tests COMPILE: `cargo check
#     --all-targets` against stub artifact dirs (build.rs only checks the
#     dirs exist and emits link flags; check never links).
#
# LOCATION LAW (paid for 2026-10-27): GitHub Actions reads ONLY
# `.github/workflows/`. This file first landed under
# `.github/archite_workflows/` and never triggered a single run (the
# repo's other three workflow files share that dead directory — their last
# runs predate the move; moving them back is the owner's call, not this
# lane's).

on:
  pull_request:
    paths:
      - 'pkgs/xsoulspace_inference_mlx_native/**'
      - '.github/workflows/mlx_native_gate.yml'
  push:
    branches: [main, master, ag-c]
    paths:
      - 'pkgs/xsoulspace_inference_mlx_native/**'
      - '.github/workflows/mlx_native_gate.yml'

jobs:
  native-compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: stub the machine-local MLX artifacts (named, not hidden)
        run: |
          mkdir -p "$RUNNER_TEMP/laya-mlx-stub/mlx-install/lib" \
                   "$RUNNER_TEMP/laya-mlx-stub/mlxc-install/lib"
      - name: cargo check (release, all targets — the CI-able compile gate)
        working-directory: pkgs/xsoulspace_inference_mlx_native/native/mlx_native
        env:
          LAYA_MLX_BUILD_DIR: ${{ runner.temp }}/laya-mlx-stub
        run: cargo check --release --all-targets
