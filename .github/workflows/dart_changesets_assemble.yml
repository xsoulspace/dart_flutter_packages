# dart_changesets release train — see PUBLISHING.md and ADR 0073.
# The engine lives in Arenukvern/dart_changesets; this thin workflow calls
# the action, which assembles the version PR from pending intent files and,
# on the version-PR merge, pushes one tag per release and dispatches the
# per-tag publish runs.
name: dart_changesets

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dart-changesets-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: Arenukvern/dart_changesets@v1
        with:
          # This repo's per-tag publish workflow (the action's default
          # `publish.yml` does not exist here).
          publish-workflow: dart_changesets_publish.yml
          # PAT tag pushes fire the publish workflow (pub.dev authorizes push
          # events only); reuses the release-please-era secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
